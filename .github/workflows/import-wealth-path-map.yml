name: Import wealth path map

on:
  push:
    paths:
      - ".github/workflows/import-wealth-path-map.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exact wealth-path-map.html
        run: |
          mkdir -p halfacre-research-site/hivemind
          curl -fsSL -o halfacre-research-site/hivemind/wealth-path-map.html \
            https://raw.githubusercontent.com/HalfacreResearch/halfacre-research-site/main/hivemind/wealth-path-map.html
          bytes=$(wc -c < halfacre-research-site/hivemind/wealth-path-map.html)
          echo "downloaded_bytes=$bytes"
          test "$bytes" -ge 780000
      - name: Commit the map if it is new or changed
        run: |
          git config user.name "Halfacre Research"
          git config user.email "matt@halfacreresearch.tech"
          git add halfacre-research-site/hivemind/wealth-path-map.html
          if git diff --cached --quiet; then
            echo "wealth-path-map.html already current"
            exit 0
          fi
          git commit -m "Add Hivemind wealth path map"
          git push
